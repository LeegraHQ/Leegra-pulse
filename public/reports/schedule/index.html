<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Execution calendar · Leegra Pulse</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a20; --card-2:#1d212a; --line:#282d38;
    --text:#e9e9ed; --muted:#8b93a1; --accent:#cdf564; --accent-dim:#3d4a1f;
    --bridgestone:#e2725b; --beurer:#6aa9e0; --dmq:#b48ce0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--accent)} a:hover{color:#e2ff8c}
  button{font:inherit;cursor:pointer}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:600;letter-spacing:.2px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px}
  .chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .spacer{margin-left:auto}
  .status{font-size:12px;color:var(--muted)}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .toolbar .group{display:flex;gap:6px;align-items:center}
  .toolbar label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
  main{flex:1 1 auto;display:flex;min-height:0}
  .pool{width:290px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .pool-head{padding:12px 14px 8px;font-size:12px;color:var(--muted);display:flex;align-items:baseline;gap:8px}
  .pool-list{overflow-y:auto;padding:0 12px 16px;display:flex;flex-direction:column;gap:6px}
  .days{flex:1 1 auto;overflow-x:auto;overflow-y:hidden;display:flex;gap:0}
  .day{width:230px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .day.weekend{background:#12141a}
  .day.over{background:#1b2412}
  .day-head{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:inherit}
  .day-name{font-size:12px;color:var(--muted)}
  .day-date{font-size:15px;font-weight:600}
  .day-count{font-size:11px;color:var(--muted);margin-top:2px}
  .day-body{flex:1 1 auto;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
  .store{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:8px 10px;cursor:grab;text-align:left;color:inherit;width:100%;display:block}
  .store:hover{border-color:#3a4150;background:var(--card-2)}
  .store.sel{border-color:var(--accent)}
  .store-name{font-size:12.5px;line-height:1.3}
  .store-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .owner{color:var(--accent)}
  .has-note{color:var(--muted)}
  .panel{width:300px;flex:0 0 auto;border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  .panel h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
  .panel .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  textarea{min-height:110px;resize:vertical;width:100%}
  .btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 12px}
  .btn:hover{background:var(--accent-dim)}
  .btn-quiet{border-color:var(--line);color:var(--muted)}
  .btn-quiet:hover{background:var(--card-2);color:var(--text)}
  .empty{color:#5a6270;font-size:12px;padding:10px 2px}
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:320px;display:flex;flex-direction:column;gap:12px}
  .gate input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;letter-spacing:.14em;text-align:center}
  .err{color:#e2725b;font-size:12px;min-height:16px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gate-form">
    <div style="font-weight:600">Leegra Pulse · Execution calendar</div>
    <div style="font-size:12px;color:var(--muted)">Enter your access code.</div>
    <input id="code" type="password" inputmode="text" autocomplete="off" placeholder="Access code" autofocus>
    <div class="err" id="gate-err"></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>

<header>
  <div class="brand">Store execution · <span id="month-label">August 2026</span></div>
  <span class="status" id="scheduled-count"></span>
  <div class="spacer"></div>
  <span class="status" id="save-status"></span>
  <a href="/" class="chip" style="text-decoration:none">Back to Pulse</a>
</header>

<div class="toolbar">
  <div class="group"><label>Client</label><span id="f-client"></span></div>
  <div class="group"><label>Who</label><span id="f-owner"></span></div>
  <div class="group"><label>Province</label><select id="f-prov"></select></div>
  <input type="search" id="f-search" placeholder="Find a store">
  <button class="chip" id="f-clear">Clear</button>
</div>

<main>
  <section class="pool">
    <div class="pool-head"><strong id="pool-count"></strong> <span>not yet scheduled</span></div>
    <div class="pool-list" id="pool-list"></div>
  </section>
  <section class="days" id="days"></section>
  <aside class="panel" id="panel"></aside>
</main>

    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.token) { err.textContent = data.error || 'That code was not accepted.'; return; }
    if (!String(data.role || '').startsWith('leegra_')) { err.textContent = 'This calendar is for Leegra staff only.'; return; }
    session = { token: data.token, role: data.role, canEdit: data.role !== 'leegra_report_only' };
    document.getElementById('gate').remove();
    await load();
  } catch (e2) { err.textContent = 'Could not reach the server. Check your connection.'; }
});

/* -------------------------------- data ---------------------------------- */
async function load() {
  try {
    const res = await fetch('/api/schedule?month=' + MONTH, { headers: { Authorization: 'Bearer ' + session.token } });
    if (res.ok) {
      const d = await res.json();
      assignments = d.assignments || {}; notes = d.notes || {}; owners = d.owners || {};
      setStatus(d.updatedAt ? 'Last saved ' + new Date(d.updatedAt).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + (d.updatedBy ? ' by ' + d.updatedBy.split('@')[0] : '') : 'Nothing scheduled yet');
    } else setStatus('Could not load the saved plan (' + res.status + ')');
  } catch (e) { setStatus('Could not load the saved plan'); }
  render();
}

let saveTimer = null;
function save() {
  if (!session.canEdit) return;
  clearTimeout(saveTimer);
  setStatus('Saving…');
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/schedule', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.token },
        body: JSON.stringify({ month: MONTH, assignments, notes, owners }),
      });
      if (res.ok) { const d = await res.json(); setStatus('Saved ' + new Date(d.updatedAt).toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' })); }
      else setStatus('Not saved (' + res.status + ') — your changes are still on screen');
    } catch (e) { setStatus('Not saved — check your connection'); }
  }, 700);
}
const setStatus = t => { document.getElementById('save-status').textContent = t; };

/* ------------------------------- filters -------------------------------- */
function renderFilters() {
  const mk = (list, key, host) => {
    host.innerHTML = '';
    list.forEach(v => {
      const b = document.createElement('button');
      b.className = 'chip' + (filters[key] === v ? ' on' : '');
      b.textContent = v;
      b.addEventListener('click', () => { filters[key] = filters[key] === v ? null : v; render(); });
      host.appendChild(b);
    });
  };
  mk(CLIENTS, 'client', document.getElementById('f-client'));
  mk(OWNERS, 'owner', document.getElementById('f-owner'));
  const sel = document.getElementById('f-prov');
  if (!sel.options.length) {
    sel.innerHTML = '<option value="">All provinces</option>' + PROVINCES.map(p => '<option>' + esc(p) + '</option>').join('');
    sel.addEventListener('change', () => { filters.prov = sel.value; render(); });
  }
  const q = document.getElementById('f-search');
  if (!q.dataset.wired) { q.dataset.wired = '1'; q.addEventListener('input', () => { filters.q = q.value.toLowerCase(); render(); }); }
  document.getElementById('f-clear').onclick = () => {
    filters = { client: null, owner: null, prov: '', q: '' };
    sel.value = ''; q.value = ''; render();
  };
}

const matches = s => (!filters.client || s.client === filters.client)
  && (!filters.owner || ownerOf(s.id) === filters.owner)
  && (!filters.prov || s.province === filters.prov)
  && (!filters.q || s.name.toLowerCase().includes(filters.q));

/* -------------------------------- render -------------------------------- */
function storeEl(s, inDay) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'store' + (selected === s.id ? ' sel' : '');
  el.style.borderLeftColor = CLIENT_COLOR[s.client] || 'var(--line)';
  el.draggable = session.canEdit;
  el.dataset.id = s.id;
  const note = noteOf(s.id);
  el.innerHTML = '<div class="store-name">' + esc(s.name) + '</div>'
    + '<div class="store-meta"><span class="owner">' + esc(ownerOf(s.id) || 'Unassigned') + '</span>'
    + '<span>' + esc(s.client) + '</span>'
    + (inDay ? '' : '<span>' + esc(s.province) + '</span>')
    + (note ? '<span class="has-note" title="' + esc(note) + '">💬</span>' : '')
    + '</div>';
  el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', s.id); e.dataTransfer.effectAllowed = 'move'; });
  el.addEventListener('click', () => { selected = s.id; render(); });
  return el;
}

function render() {
  renderFilters();
  const pool = STORES.filter(s => !assignments[s.id]);
  const poolShown = pool.filter(matches);
  document.getElementById('pool-count').textContent = poolShown.length + (poolShown.length !== pool.length ? ' of ' + pool.length : '');
  document.getElementById('scheduled-count').textContent = (STORES.length - pool.length) + ' of ' + STORES.length + ' stores placed';
  const list = document.getElementById('pool-list');
  list.innerHTML = '';
  if (!poolShown.length) list.innerHTML = '<div class="empty">Nothing here — every store matching these filters has a day.</div>';
  poolShown.forEach(s => list.appendChild(storeEl(s, false)));

  const days = document.getElementById('days');
  days.innerHTML = '';
  DAYS.forEach(iso => {
    const f = fmtDay(iso);
    const col = document.createElement('div');
    col.className = 'day' + (f.weekend ? ' weekend' : '');
    const mine = STORES.filter(s => assignments[s.id] === iso);
    const shown = mine.filter(matches);
    col.innerHTML = '<div class="day-head"><div class="day-name">' + f.wd + '</div>'
      + '<div class="day-date">' + f.num + ' ' + f.mon + '</div>'
      + '<div class="day-count">' + (mine.length ? mine.length + ' store' + (mine.length > 1 ? 's' : '') : 'Empty') + '</div></div>';
    const body = document.createElement('div');
    body.className = 'day-body';
    shown.forEach(s => body.appendChild(storeEl(s, true)));
    col.appendChild(body);
    if (session.canEdit) {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over');
        const id = e.dataTransfer.getData('text/plain');
        if (!id || !BY_ID[id]) return;
        assignments[id] = iso; selected = id; save(); render();
      });
    }
    days.appendChild(col);
  });

  renderPanel();
}

function renderPanel() {
  const p = document.getElementById('panel');
  if (!selected || !BY_ID[selected]) {
    p.innerHTML = '<div class="k">Selected store</div><div class="empty">Pick a store to set its day, who is doing it, and a comment.'
      + (session.canEdit ? ' You can also drag a store straight onto a day.' : ' You are signed in read-only.') + '</div>';
    return;
  }
  const s = BY_ID[selected];
  p.innerHTML = '';
  const h = document.createElement('div');
  h.innerHTML = '<div class="k">Store</div><h3>' + esc(s.name) + '</h3>'
    + '<div class="store-meta" style="margin-top:6px"><span>' + esc(s.client) + '</span><span>' + esc(s.province) + '</span></div>';
  p.appendChild(h);

  const dayWrap = document.createElement('div');
  dayWrap.innerHTML = '<div class="k">Day</div>';
  const daySel = document.createElement('select');
  daySel.style.width = '100%';
  daySel.innerHTML = '<option value="">Not scheduled</option>' + DAYS.map(iso => {
    const f = fmtDay(iso);
    return '<option value="' + iso + '"' + (assignments[s.id] === iso ? ' selected' : '') + '>' + f.wd + ' ' + f.num + ' ' + f.mon + '</option>';
  }).join('');
  daySel.disabled = !session.canEdit;
  daySel.addEventListener('change', () => {
    if (daySel.value) assignments[s.id] = daySel.value; else delete assignments[s.id];
    save(); render();
  });
  dayWrap.appendChild(daySel);
  p.appendChild(dayWrap);

  const ownWrap = document.createElement('div');
  ownWrap.innerHTML = '<div class="k">Action by</div>';
  const ownSel = document.createElement('select');
  ownSel.style.width = '100%';
  ownSel.innerHTML = OWNERS.map(o => '<option' + (ownerOf(s.id) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('');
  ownSel.disabled = !session.canEdit;
  ownSel.addEventListener('change', () => { owners[s.id] = ownSel.value; save(); render(); });
  ownWrap.appendChild(ownSel);
  p.appendChild(ownWrap);

  const noteWrap = document.createElement('div');
  noteWrap.innerHTML = '<div class="k">Comments</div>';
  const ta = document.createElement('textarea');
  ta.value = noteOf(s.id);
  ta.placeholder = 'Anything the team should know about this store';
  ta.disabled = !session.canEdit;
  ta.addEventListener('input', () => { notes[s.id] = ta.value; save(); });
  noteWrap.appendChild(ta);
  p.appendChild(noteWrap);

  if (session.canEdit && assignments[s.id]) {
    const rm = document.createElement('button');
    rm.className = 'btn btn-quiet';
    rm.textContent = 'Take off the calendar';
    rm.addEventListener('click', () => { delete assignments[s.id]; save(); render(); });
    p.appendChild(rm);
  }
}

renderFilters();
</script>
</body>
</html>
