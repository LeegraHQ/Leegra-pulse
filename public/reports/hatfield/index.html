document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;font-size:11px;color:#B8C4D9;line-height:1.5\">Source: Hatfield Group Mystery Shopping Complete report Feedback<\u002Fdiv>\n  <\u002Faside>\n\n  <main data-printmain=\"1\" style=\"flex:1;min-width:0;padding:28px\">\n    <div data-printonly=\"1\" style=\"display:none;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #0A2342\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><img src=\"1535b9da-b11c-4f92-b938-7a74a0ad693a\" alt=\"Hatfield\" style=\"width:34px;height:34px;object-fit:contain\"><strong style=\"font-size:15px;color:#0A2342\">Hatfield Motor Group · Mystery Shopping Report<\u002Fstrong><\u002Fdiv>\n        <span style=\"font-size:11px;color:#64748b\">{{ printMeta }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">{{ kicker }}<\u002Fp>\n        <h2 style=\"font-size:30px;margin:0;color:#0A2342;font-weight:800\">{{ pageTitle }}<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n      <button data-noprint=\"1\" sc-camel-on-click=\"{{ exportPdf }}\" style=\"border:0;background:#F28C28;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap\">Export PDF<\u002Fbutton>\n      <div style=\"display:flex;gap:8px;align-items:center;background:#e9edf2;padding:5px;border-radius:999px;flex-wrap:wrap\">\n        <span style=\"background:#16A34A;color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap\">Complete: {{ countComplete }}<\u002Fspan>\n        <span style=\"background:#F59E0B;color:# >\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);border:1px solid #e5e7eb;grid-column:1/-1;order:3\">\n          <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">Score history<\u002Fp>\n          <h3 style=\"margin:0 0 4px;font-size:19px;color:#0A2342;font-weight:800\">Audit scores by department<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:12px;color:#64748b\">Every audit per department, with the change against the previous audit where there is one. Click a bar to open the audit.<\u002Fp>\n          <div style=\"display:grid;gap:14px\">\n            <sc-for list=\"{{ chart }}\" as=\"ch\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr);gap:16px;align-items:start;border-top:1px solid #e5e7eb;padding-top:14px\">\n                <div><strong style=\"color:#0A2342;display:block;font-size:14px\">{{ ch.dealer }}<\u002Fstrong><span style=\"color:#94a3b8;font-size:11px\">{{ ch.sub }}<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n                  <sc-for list=\"{{ ch.depts }}\" as=\"dp\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px;background:#f8fafc;border-radius:14px;padding:10px 12px\">\n                      <span style=\"font-size:11px;font-weight:800;color:#0A2342;text-transform:uppercase;letter-spacing:.06em\">{{ dp.name }}<\u002Fspan>\n                      <sc-for list=\"{{ dp.bars }}\" as=\"b\" hint-placeholder-count=\"1\">\n                        <button sc-camel-on-click=\"{{ b.go }}\" style=\"border:0;ba uto-fit,minmax(min(100%,300px),1fr));gap:20px;margin-bottom:20px\">\n          <div style=\"background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);border:1px solid #e5e7eb;text-align:center\">\n            <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">Leegra Performance Index<\u002Fp>\n            <div style=\"width:168px;height:168px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;background:{{ a.ringBg }}\">\n              <div style=\"width:132px;height:132px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#0A2342\">{{ a.pctText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <h3 data-audit-title=\"{{ a.titleText }}\" style=\"margin:0 0 4px;font-size:18px;color:#0A2342;font-weight:800\">{{ a.dealer }}<\u002Fh3>\n            <p style=\"margin:0 0 12px;color:#64748b;font-size:13px\">{{ deptName }} · Audit {{ a.auditNo }}<\u002Fp>\n            <span style=\"display:inline-block;color:#fff;padding:7px 14px;border-radius:999px;font-weight:800;font-size:12px;background:{{ a.bandColor }}\">{{ a.bandText }}<\u002Fspan>\n            <div style=\"margin-top:16px;display:grid;gap:8px;text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center\"><span style=\"color:#64748b\">Audit date<\u002Fspan><strong style=\"color:#0A2342;text-align:right\">{{ a.dateText }}<\u002Fstrong><\u002Fdiv>\n              <sc-if value=\"{{ canEditDates }}\" hint-placeholder-val=\"{{ false }}\">\n                <input type=\"date\" value=\"{{ a.auditDate }}\" sc-camel-on-change=\"{{ a.setDate }}\" style=\"border:1px solid #d1d5db;border-radius:10px;padding:6px 8px;font-family:inherit;font-size:12px\">\n              <\u002Fsc-if>\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px\"><span style=\"color:#64748b\">Owner<\u002Fspan><strong style=\"color:#0A2342;text-align:right\">{{ a.owner }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px\"><span style=\"color:#64748b\">Due date<\u002Fspan><strong style=\"color:#0A2342;text-align:right\">{{ a.dueText }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px\"><span style=\"color:#64748b\">Status<\u002Fspan><strong style=\"color:#0A2342;text-align:right\">{{ a.statusText }}<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);border:1px solid #e5e7eb\">\n            <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">Section Performance<\u002Fp>\n            <h3 style=\"margin:0 0 16px;font-size:19px;color:#0A2342;font-weight:800\">{{ deptName }} Heatmap<\u002Fh3>\n            <sc-if value=\"{{ a.isComplete }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;gap:14px\">\n                <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 46px;gap:12px;align-items:center\">\n                    <strong style=\"font-size:13px;color:#0A2342\">{{ s.section }}<\u002Fstrong>\n                    <div style=\"height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden\"><div style=\"height:100%;border-radius:999px;width:{{ s.pctText }};background:{{ s.color }}\"><\u002Fdiv><\u002Fdiv>\n                    <span style=\"font-size:13px;font-weight:800;color:#0A2342;text-align:right\">{{ s.pctText }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ a.notComplete }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"color:#64748b;font-size:14px;margin:0\">{{ a.pendingText }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);border:1px solid #e5e7eb\">\n            <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">Corrective Action<\u002Fp>\n            <h3 style=\"margin:0 0 14px;font-size:19px;color:#0A2342;font-weight:800\">Next steps<\u002Fh3>\n            <div style=\"background:#fff7ed;padding:14px;border-radius:14px;font-size:13px;color:#7c2d12;font-weight:700;margin-bottom:14px\">{{ a.actionText }}<\u002Fdiv>\n            <p style=\"font-size:12px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px\">Focus areas (below 60%)<\u002Fp>\n            <div style=\"display:grid;gap:8px\">\n              <sc-for list=\"{{ alerts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"background:#fef2f2;padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;gap:8px;font-size:13px\"><strong style=\"color:#0A2342\">{{ c.section }}<\u002Fstrong><strong style=\"color:#DC2626\">{{ c.pctText }}<\u002Fstrong><\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#eff6ff;padding:10px 12px;border-radius:12px;font-size:13px;color:#1e3a8a\">No sections below 60%.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);border:1px solid #e5e7eb;margin-bottom:20px\">\n          <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">Audit Detail<\u002Fp>\n          <h3 style=\"margin:0 0 14px;font-size:19px;color:#0A2342;font-weight:800\">Questions, scores &amp; evidence<\u002Fh3>\n          <div style=\"overflow-x:auto;border-radius:14px;border:1px solid #e5e7eb\">\n            <sc-raw-table style=\"width:100%;min-width:860px;border-collapse:collapse\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th style=\"background:#0A2342;color:#fff;text-align:left;padding:11px 12px;font-size:12px\">Section<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#0A2342;color:#fff;text-align:left;padding:11px 12px;font-size:12px\">Question<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#0A2342;color:#fff;text-align:left;padding:11px 12px;font-size:12px\">Weight<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#0A2342;color:#fff;text-align:left;padding:11px 12px;font-size:12px\">Score<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#0A2342;color:#fff;text-align:left;padding:11px 12px;font-size:12px\">Evidence / Comments<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"10\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"border-bottom:1px solid #e5e7eb;padding:10px 12px;font-size:13px;color:#0A2342;font-weight:700;min-width:130px\">{{ q.section }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #e5e7eb;padding:10px 12px;font-size:13px;min-width:240px\">{{ q.question }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #e5e7eb;padding:10px 12px;font-size:13px;color:#64748b\">{{ q.weightText }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #e5e7eb;padding:10px 12px\"><span style=\"display:inline-block;padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px;background:{{ q.bg }};color:{{ q.color }}\">{{ q.scoreText }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #e5e7eb;padding:10px 12px;font-size:13px;color:#475569;min-width:260px;text-wrap:pretty\">{{ q.evidence }}<\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section data-noprint=\"1\" style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border-radius:18px;padding:14px 18px;border:1px solid #e5e7eb;margin-bottom:20px\">\n          <span style=\"font-size:13px;color:#64748b\">Photos, emails and video links for this audit are on the Proof of Audit tab.<\u002Fspan>\n          <button sc-camel-on-click=\"{{ openProof }}\" style=\"border:1px solid #0A2342;background:#fff;color:#0A2342;padding:9px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer\">View proof of audit<\u002Fbutton>\n        <\u002Fsection>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isProof }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-noprint=\"1\" style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px 12px\">\n        <span style=\"font-size:11px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:0 4px\">Filter<\u002Fspan>\n        <sc-raw-select value=\"{{ proofDealerValue }}\" sc-camel-on-change=\"{{ setProofDealer }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:9px 12px;font-family:inherit;font-weight:700;color:#0A2342;background:#fff\">\n          <sc-for list der-radius:999px;font-weight:800;font-size:12px;background:{{ pa.scoreBg }};color:{{ pa.scoreFg }}\">{{ pa.score }}<\u002Fspan>\n              <button data-noprint=\"1\" sc-camel-on-click=\"{{ pa.open }}\" style=\"border:1px solid #0A2342;background:#fff;color:#0A2342;padding:7px 14px;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer\">Open audit<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px\">\n            <sc-for list=\"{{ pa.cats }}\" as=\"cat\" hint-placeholder-count=\"2\">\n              <div style=\"background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:center\">\n                  <strong style=\"font-size:14px;color:#0A2342\">{{ cat.label }}<\u002Fstrong>\n                  <span style=\"font-size:12px;color:#64748b;font-weight:700\">{{ cat.count }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ cat.showLink }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;gap:8px\">\n                    <input value=\"{{ cat.linkValue }}\" sc-camel-on-change=\"{{ cat.setLink }}\" placeholder=\"Paste video link (Google Drive, OneDrive, YouTube)\" style=\"flex:1;min-width:0;border:1px solid #d1d5db;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:13px\">\n                    <button sc-camel-on-click=\"{{ cat.addLink }}\" style=\"border:0;background:#0A2342;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer\">Add<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ cat.showFile }}\" hint-placeholder-val=\"{{ false }}\">\n                  <label style=\"display:flex;align-items:center;justify-content:center;border:2px dashed #cbd5e1;border-radius:14px;padding:12px;cursor:pointer;font-size:13px;font-weight:700;color:#0A2342;background:#fff\">\n                    <span>+ Upload {{ cat.short }}<\u002Fspan>\n                    <input type=\"file\" accept=\"{{ cat.accept }}\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ cat.onUpload }}\" style=\"display:none\">\n                  <\u002Flabel>\n                <\u002Fsc-if>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px\">\n                  <sc-for list=\"{{ cat.items }}\" as=\"it\" hint-placeholder-count=\"0\">\n                    <a href=\"{{ it.url }}\" target=\"_blank\" rel=\"noreferrer\" style=\"position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #e2e8f0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-decoration:none\">\n                      <sc-if value=\"{{ it.isImage }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ it.url }}\" alt=\"{{ it.name }}\" style=\"width:100%;height:100%;object-fit:cover\"><\u002Fsc-if>\n                      <sc-if value=\"{{ it.isOther }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;color:#64748b;padding:6px;text-align:center;word-break:break-all\">{{ it.name }}<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ it.isLink }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;text-align:center\"><span style=\"width:30px;height:30px;border-radius:50%;background:#F28C28;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px\">▶<\u002Fspan><span style=\"font-size:10px;color:#0A2342;font-weight:700;word-break:break-all\">{{ it.short }}<\u002Fspan><\u002Fspan><\u002Fsc-if>\n                    <\u002Fa>\n                  <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u00 Fdiv>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto\">\n          <div style=\"min-width:640px\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px\">\n              <sc-for list=\"{{ weekdays }}\" as=\"w\" hint-placeholder-count=\"7\">\n                <div style=\"text-align:center;font-size:11px;color:#94a3b8;font-weight:800;text-transform:uppercase\">{{ w }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px\">\n              <sc-for list=\"{{ calCells }}\" as=\"c\" hint-placeholder-count=\"35\">\n                <div style=\"border:1px solid {{ c.border }};background:{{ c.bg }};border-radius:12px;padding:7px;min-height:84px;display:flex;flex-direction:column;gap:4px;min-width:0\">\n                  <span style=\"font-size:12px;font-weight:800;color:{{ c.dayColor }}\">{{ c.day }}<\u002Fspan>\n                  <sc-for list=\"{{ c.events }}\" as=\"ev\" hint-placeholder-count=\"0\">\n                    <span title=\"{{ ev.title }}\" style=\"font-size:10px;font-weight:700;color:#fff;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:{{ ev.color }}\">{{ ev.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);border:1px solid #e5e7eb;overflow-x:auto\">\n        <p style=\"text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#F28C28;font-weight:800;margin:0 0 6px\">Schedule<\u002Fp>\n        <h3 style=\"margin:0 0 14px;font-size:19px;color:#0A2342;font-weight:800\">Next audit &amp; follow-up dates<\u002Fh3>\n        <sc-raw-table style=\"width:100%;min-width:       dealer: d.name, sub: d.region + ' · ' + String(d.brand || '').trim(),\n        depts: colDepts.map(dp => {\n          const list = byDD(d.name, dp.key).slice().sort((x, y) => x.auditNo - y.auditNo);\n          const scored = list.filter(a => a.pct != null);\n          const last = scored[scored.length - 1], prev = scored[scored.length - 2];\n          let note = 'No audit yet', noteColor = '#94a3b8';\n          if (list.length) {\n            if (!prev) { note = 'No previous audit'; noteColor = '#64748b'; }\n            else { const diff = Math.round(last.pct) - Math.round(prev.pct); note = (diff > 0 ? '+' : '') + diff + ' pts vs previous audit'; noteColor = diff > 0 ? '#16A34A' : diff < 0 ? '#DC2626' : '#64748b'; }\n          }\n          return {\n            name: dp.name, note, noteColor, empty: !list.length,\n            bars: list.map(a => {\n              const b = band(a.pct);\n              return { label: 'Audit ' + a.auditNo, date: a.auditDate ? fmtD(a.auditDate) : '', w: (a.pct != null ? Math.max(3, a.pct) : 0) + '%', c: b.c, text: a.pct != null ? fmtP(a.pct) : (a.state === 'in_progress' ? 'In progress' : 'Scheduled'), go: () => goDept(dp.key, d.name, a.auditNo) };\n            }),\n          };\n        }),\n      }));\n      out.groupAlerts = secs.sort((a, b) => a.p - b.p).slice(0, 6).map(s => ({ ...s, pctText: fmtP(s.p) }));\n    }\n\n    if (out.isDept) {\n      const dept = DEPTS.find(d => d.key === view);\n      out.deptName = dept.name;\n      const dd = dealers.filter(d => audits.some(a => a.dealer === d.name && a.dept === view));\n      out.noDeptAudits = !dd.length;\n      const sel = dd.find(d => d.name === this.state.dealer[view]) || dd[0];\n      out.deptDealers = dd.map(d => {\n        const l = byDD(d.name, view); const sc = l.find(a => a.pct != null); const on = sel && sel.name === d.name;\n        return { name: d.name, bg: on ? '#0A2342' : '#fff', color: on ? '#fff' : '#0A2342', dot: sc ? band(sc.pct).c : (l[0].state === 'in_progress' ? '#F59E0B' : '#94a3b8'), go: () => this.setState(s => ({ dealer: { ...s.dealer, [view]: d.name } })) };\n      });\n      const list = sel ? byDD(sel.name, view).slice().reverse() : [];\n      const no = sel ? this.state.auditNo[view + sel.name] : null;\n      const a = list.find(x => x.auditNo === no) || list.filter(x => x.state === 'complete').pop() || list[list.length - 1];\n      out.hasAudit = !!a;\n      out.hasAuditTabs = list.length > 1;\n      out.auditTabs = list.map(x => { const on = a && x.auditNo === a.auditNo; return { label: 'Audit ' + x.auditNo + (x.state === 'scheduled' ? ' · scheduled' : x.state === 'in_progress' ? ' · in progress' : ''), bg: on ? '#0A2342' : '#fff', color: on ? '#fff' : '#0A2342', go: () => this.setState(s => ({ auditNo: { ...s.auditNo, [view + sel.name]: x.auditNo } })) }; });\n      if (a) {\n        const b = band(a.pct); const deg = a.pct == null ? 0 : a.pct * 3.6;\n        const complete = a.state === 'complete';\n        out.a = {\n          dealer: a.dealer, auditNo: a.auditNo, pctText: fmtP(a.pct),\n          ringBg: 'conic-gradient(' + b.c + ' ' + deg + 'deg, #e5e7eb ' + deg + 'deg)',\n          bandColor: complete ? b.c : a.state === 'in_progress' ? '#F59E0B' : '#64748b',\n          bandText: complete ? b.t : a.state === 'in_progress' ? 'In progress' : 'Scheduled',\n          titleText: a.dealer + ' - Audit ' + a.auditNo,\n          auditDate: a.auditDate || '', dateText: a.auditDate ? fmtD(a.auditDate) : 'Not captured', setDate: e => this.setAuditDate(a.key, e.target.value),\n          owner: a.owner || '—', dueText: fmtD(a.due), statusText: a.status || (complete ? 'Open' : a.state === 'in_progress' ? 'In Progress' : 'Not started'),\n          actionText: a.action || 'No corrective action captured yet.',\n          isComplete: complete, notComplete: !complete,\n          pendingText: a.state === 'in_progress' ? 'This audit is in progress. Scores will show once it is completed.' : 'This audit is scheduled. Scores will show once it is captured.',\n        };\n        const g = {}; a.rows.forEach(r => (g[r.section] = g[r.section] || []).push(r));\n        const secs = Object.entries(g).map(([section, rows]) => ({ section, p: pct(rows) }));\n        out.sections = secs.map(s => ({ section: s.section, pctText: fmtP(s.p), color: band(s.p).c }));\n        out.alerts = complete ? secs.filter(s => s.p < 60).map(s => ({ section: s.section, pctText: fmtP(s.p) })) : [];\n        out.noAlerts = complete && !out.alerts.length;\n        out.openProof = () => this.setState({ view: 'proof', proofDealer: a.dealer, proofDept: a.dept });\n        out.questions = a.rows.map(r => { const p = r.score == null ? null : r.score * 100; const qb = band(p); return { section: r.section, question: r.question, weightText: Math.round(r.weight * 1000) / 10 + '%', scoreText: fmtP(p), bg: qb.bg, color: qb.fg, evidence: r.evidence || '—' }; });\n      }\n    }\n\n    if (view === 'calendar') {\n      const { calY: y, calM: m, schedule } = this.state;\n      out.monthLabel = MONTHS[m] + ' ' + y;\n      out.weekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n      const ev = {};\n      const add = (iso, e) => { if (/^\\d{4}-\\d{2}-\\d{2}$/.test(iso || '')) (ev[iso] = ev[iso] || []).push(e); };\n      audits.forEach(a => add(a.due, { label: (SHORT[a.dealer] || a.dealer) + ' · ' + DSHORT[a.dept], title: 'Action due: ' + a.dealer + ' ' + DSHORT[a.dept] + ' audit ' + a.auditNo, color: '#0A2342' }));\n      dealers.forEach(d => { const s = schedule[d.name] || {}; add(s.next, { label: (SHORT[d.name] || d.name) + ' audit', title: 'Next audit: ' + d.name, color: '#F28C28' }); add(s.follow, { label: (SHORT[d.name] || d.name) + ' follow-up', title: 'Follow-up: ' + d.name, color: '#16A34A' }); });\n      const first = new Date(y, m, 1); const offset = (first.getDay() + 6) % 7; const days = new Date(y, m + 1, 0).getDate();\n      const cells = []; const total = Math.ceil((offset + days) / 7) * 7;\n      const t = new Date(); const todayIso = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');\n      for (let i = 0; i < total; i++) {\n        const dt = new Date(y, m, i - offset + 1); const inM = dt.getMonth() === m;\n        const iso = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');\n        cells.push({ day: dt.getDate(), events: ev[iso] || [], bg: inM ? '#fff' : '#f8fafc', border: iso === todayIso ? '#F28C28' : '#e5e7eb', dayColor: inM ? '#0A2342' : '#cbd5e1' });\n      }\n      out.calCells = cells;\n      out.prevMonth = () => this.setState(s => s.calM === 0 ? { calM: 11, calY: s.calY - 1 } : { calM: s.calM - 1 });\n      out.nextMonth = () => this.setState(s => s.calM === 11 ? { calM: 0, calY: s.calY + 1 } : { calM: s.calM + 1 });\n      out.scheduleRows = dealers.map(d => { const s = schedule[d.name] || {}; return { dealer: d.name, region: d.region, brand: d.brand, next: s.next || '', follow: s.follow || '', setNext: e => this.setSchedule(d.name, 'next', e.target.value), setFollow: e => this.setSchedule(d.name, 'follow', e.target.value) }; });\n    }\n\n    if (view === 'proof') {\n      const pd = this.state.proofDealer || 'all', pp = this.state.proofDept || 'all';\n      const dlist = dealers.filter(d => allAudits.some(a => a.dealer === d.name));\n      out.proofDealerValue = dlist.some(d => d.name === pd) ? pd : 'all';\n      out.proofDeptValue = deptAllowed.some(d => d.key === pp) ? pp : 'all';\n      out.proofDealerOptions = (dlist.length > 1 ? [{ value: 'all', label: 'All dealerships' }] : []).concat(dlist.map(d => ({ value: d.name, label: d.name })));\n      out.proofDeptOptions = (deptAllowed.length > 1 ? [{ value: 'all', label: 'All departments' }] : []).concat(deptAllowed.map(d => ({ value: d.key, label: d.name })));\n      out.setProofDealer = e => this.setState({ proofDealer: e.target.value });\n      out.setProofDept = e => this.setState({ proofDept: e.target.value });\n      const order = { new: 0, used: 1, service: 2 };\n      const list = allAudits.filter(a => inScope(a.dealer) && (out.proofDealerValue === 'all' || a.dealer === out.proofDealerValue) && (out.proofDeptValue === 'all' || a.dept === out.proofDeptValue))\n        .sort((x, y) => x.dealer.localeCompare(y.dealer) || order[x.dept] - order[y.dept] || x.auditNo - y.auditNo);\n      out.hasProofError = !!this.state.proofError; out.proofError = this.state.proofError;\n      out.proofAudits = list.map(a => {\n        const cats = this.proofCatsFor(a, isAll);\n        const n = cats.reduce((t, c) => t + c.items.length, 0);\n        const b = band(a.pct);\n        return { key: a.key, dealer: a.dealer, dept: (DEPTS.find(d => d.key === a.dept) || {}).name, auditNo: a.auditNo, score: a.pct != null ? fmtP(a.pct) : (a.state === 'in_progress' ? 'In progress' : 'Scheduled'), scoreBg: b.bg, scoreFg: b.fg, total: n + (n === 1 ? ' item' : ' items'), cats, open: () => goDept(a.dept, a.dealer, a.auditNo) };\n      });\n      out.noProofAudits = !list.length;\n      out.proofSummary = list.length + (list.length === 1 ? ' audit' : ' audits') + ' shown';\n    }\n\n    if (view === 'info') {\n      out.dealerCards = dealers.map(d => ({\n        name: d.name, region: d.region, brand: d.brand, access: d.access || 'Access not set',\n        people: [['Principal', d.principal], ['New Car Sales', d.newCar], ['Used Car Sales', d.usedCar], ['Service Dept', d.service], ['Parts Dept', d.parts]].map(([role, p]) => ({ role, name: (p && p.name) || 'Not captured', email: (p && p.email) || '', mailto: p && p.email ? 'mailto:' + p.email : '#' })),\n        hasLogin: !!d.login, login: d.login, code: isAll ? d.code : '••••',\n      }));\n      out.loginRows = data.logins.map(l => ({ role: ROLE_LABEL[l.role] || l.role, label: l.label, email: l.email, code: l.role === 'super' ? 'Pulse admin code' : l.code }));\n    }\n\n    if (view === 'costing') {\n      const rows = data.costing.filter(c => inScope(c.dealer));\n      const sum = k => rows.reduce((t, c) => t + c[k], 0);\n      out.costRows = rows.map(c => ({ dealer: c.dealer, region: c.region, brand: c.brand, newCar: R(c.newCar), usedCar: R(c.usedCar), service: R(c.service), total: R(c.total), priceIncl: R(c.priceIncl), priceExcl: R(c.priceExcl), audits: c.audits, comments: c.comments }));\n      out.costTotal = { newCar: R(sum('newCar')), usedCar: R(sum('usedCar')), service: R(sum('service')), total: R(sum('total')) };\n      out.costKpis = [\n        { label: 'Total audit value', value: R(sum('total')) },\n        { label: 'New Car Sales', value: R(sum('newCar')) },\n        { label: 'Used Car Sales', value: R(sum('usedCar')) },\n        { label: 'Service Department', value: R(sum('service')) },\n      ];\n    }\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
