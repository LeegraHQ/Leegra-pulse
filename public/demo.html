<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supa Quick — Leegra Pulse demo</title>
<style>
  /* Self-contained demo. No backend, no build step, no dependency on the live
     Leegra Pulse app — all data below is demonstration data held in this file. */
  :root {
    --bg: #14161c; --surface: #21242c; --text: #eef1e9;
    --accent: #b4fc0f; --accent-300: #d4fc7a; --accent-2-400: #bdf23f;
    --neutral-500: #9397ab; --radius-lg: 14px; --radius-md: 8px;
    --shadow-md: 0 0 0 1px #3a3d33, 0 6px 18px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent-300); text-decoration: none; }
  a:hover { color: var(--accent); }
  .shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 28px 22px; display: flex; flex-direction: column; gap: 16px; width: 100%; }
  .brand { font-size: 24px; font-weight: 500; margin-top: 12px; }
  .slogan { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-300); }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: color-mix(in srgb, var(--text) 70%, transparent); }
  .input { min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); border-radius: var(--radius-md); width: 100%; }
  .input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { font-size: 12px; color: var(--accent-300); min-height: 15px; }
  .muted { color: color-mix(in srgb, var(--text) 55%, transparent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font: inherit; font-size: 13px; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid transparent; background: transparent; color: var(--text); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { border: 1px solid var(--accent); color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .btn-secondary { border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent-300); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .block { width: 100%; }
  .nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .nav-brand { font-size: 15px; font-weight: 500; }
  .nav nav { display: flex; gap: 16px; margin-left: 8px; }
  .nav nav a { color: var(--text); font-size: 14px; opacity: .6; }
  .nav nav a.on { color: var(--accent); opacity: 1; }
  .inner { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--text) 5%, var(--surface)); }
  .kicker { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-300); }
  .title { font-size: 17px; }
  .title.lg { font-size: 26px; }
  .title.accent { color: var(--accent-300); }
  .meta { font-size: 11px; color: color-mix(in srgb, var(--text) 50%, transparent); }
  .tag { display: inline-flex; align-items: center; font: inherit; font-size: 11px; padding: 3px 10px; border-radius: 6px; border: none; background: none; color: inherit; align-self: flex-start; }
  .tag-accent { background: #2b2741; color: var(--accent-300); }
  .tag-accent2 { background: #2b293a; color: var(--accent-2-400); }
  .tag-neutral { background: #292b31; color: #b2b6ca; }
  .tag-outline { border: 1px solid var(--accent); color: var(--accent-300); cursor: pointer; }
  .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .5; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--text) 5%, var(--surface)); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--text) 60%, transparent); padding: 8px; border-bottom: 1px solid color-mix(in srgb, var(--text) 16%, transparent); }
  td { padding: 8px; border-bottom: 1px solid color-mix(in srgb, var(--text) 8%, transparent); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .bar { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--text) 12%, transparent); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .barrow { display: grid; grid-template-columns: 1fr 46px; gap: 10px; align-items: center; font-size: 13px; }
  .barrow .n { text-align: right; color: color-mix(in srgb, var(--text) 70%, transparent); font-size: 12px; }
  .demo-flag { position: fixed; top: 0; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px; background: #2b2741; color: var(--accent-300); z-index: 10; }
  @media (max-width: 760px) {
    .grid4, .grid2, .grid3 { grid-template-columns: 1fr; }
    .shell { padding: 28px 14px; }
  }
</style>
</head>
<body>
<div class="demo-flag">Demo environment — demonstration data</div>
<div class="shell" id="root"></div>

<script>
const DEMO_CODE = '1234';
const REPORT_URL = '/reports/supaquick/';

const CLIENT = {
  name: 'Supa Quick', code: 'SUP-042', logo: '/logos/supaquick-logo.png',
  staffName: 'Kagiso T.', repStoreCount: 4,
  compliance: '94%', completedPlanned: '141/150', storesCovered: '29/30', oosIssues: '2',
  stores: [
    { name: 'Supa Quick Randburg', code: 'SPQ-011', region: 'Jhb North', lastVisit: 'Today', status: 'On track' },
    { name: 'Supa Quick Boksburg', code: 'SPQ-210', region: 'Ekurhuleni', lastVisit: 'Yesterday', status: 'On track' },
    { name: 'Supa Quick Centurion', code: 'SPQ-330', region: 'Pretoria', lastVisit: '3 days ago', status: 'On track' },
    { name: 'Supa Quick Vereeniging', code: 'SPQ-441', region: 'Vaal', lastVisit: '6 days ago', status: 'Due' },
  ],
  leaderboard: [
    { rank: 1, name: 'Kagiso T.', score: '97%' },
    { rank: 2, name: 'Willem P.', score: '93%' },
    { rank: 3, name: 'Tumi R.', score: '90%' },
  ],
};

const QUESTIONS = [
  { id: 'q1', type: 'boolean', label: 'Fitment bay signage in place', required: true },
  { id: 'q2', type: 'boolean', label: 'Promotional pricing displayed correctly', required: true },
  { id: 'q3', type: 'photo', label: 'Photo — forecourt display', required: true },
  { id: 'q4', type: 'choice', label: 'Stock availability', options: ['Full', 'Partial', 'Out of stock'] },
  { id: 'q5', type: 'number', label: 'Tyres on display' },
  { id: 'q6', type: 'text', label: 'Manager comment' },
];

// Visit-level records behind the dashboard totals — the Data tab.
const VISIT_DATA = [
  { date: '2026-08-17', store: 'Supa Quick Randburg', code: 'SPQ-011', region: 'Jhb North', rep: 'Kagiso T.', type: 'Standard visit', score: '5 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-17', store: 'Supa Quick Centurion', code: 'SPQ-330', region: 'Pretoria', rep: 'Willem P.', type: 'Standard visit', score: '4 / 5', oos: 1, status: 'Complete' },
  { date: '2026-08-16', store: 'Supa Quick Boksburg', code: 'SPQ-210', region: 'Ekurhuleni', rep: 'Tumi R.', type: 'Snag Report', score: '3 / 5', oos: 1, status: 'Complete' },
  { date: '2026-08-14', store: 'Supa Quick Randburg', code: 'SPQ-011', region: 'Jhb North', rep: 'Kagiso T.', type: 'Standard visit', score: '5 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-13', store: 'Supa Quick Centurion', code: 'SPQ-330', region: 'Pretoria', rep: 'Willem P.', type: 'Standard visit', score: '5 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-12', store: 'Supa Quick Vereeniging', code: 'SPQ-441', region: 'Vaal', rep: 'Tumi R.', type: 'Standard visit', score: '4 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-11', store: 'Supa Quick Boksburg', code: 'SPQ-210', region: 'Ekurhuleni', rep: 'Tumi R.', type: 'Standard visit', score: '4 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-10', store: 'Supa Quick Randburg', code: 'SPQ-011', region: 'Jhb North', rep: 'Kagiso T.', type: 'Snag Report', score: '5 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-07', store: 'Supa Quick Vereeniging', code: 'SPQ-441', region: 'Vaal', rep: 'Willem P.', type: 'Standard visit', score: '3 / 5', oos: 1, status: 'Complete' },
  { date: '2026-08-06', store: 'Supa Quick Centurion', code: 'SPQ-330', region: 'Pretoria', rep: 'Kagiso T.', type: 'Standard visit', score: '5 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-05', store: 'Supa Quick Boksburg', code: 'SPQ-210', region: 'Ekurhuleni', rep: 'Tumi R.', type: 'Standard visit', score: '4 / 5', oos: 0, status: 'Complete' },
  { date: '2026-08-04', store: 'Supa Quick Vereeniging', code: 'SPQ-441', region: 'Vaal', rep: 'Willem P.', type: 'Standard visit', score: '4 / 5', oos: 0, status: 'Complete' },
];

// The Reality Check report view — scored fields as captured in store.
const SCORES = [
  { label: 'Forecourt presentation', v: 4.6 },
  { label: 'Fitment bay condition', v: 4.2 },
  { label: 'Promotional compliance', v: 4.8 },
  { label: 'Stock availability', v: 3.9 },
  { label: 'Staff product knowledge', v: 4.1 },
];
const REGIONS = [
  { label: 'Jhb North', v: 96 }, { label: 'Pretoria', v: 94 },
  { label: 'Ekurhuleni', v: 91 }, { label: 'Vaal', v: 86 },
];
const RANKING = [
  { store: 'Supa Quick Randburg', code: 'SPQ-011', score: '4.8 / 5', visits: 38, oos: 0 },
  { store: 'Supa Quick Centurion', code: 'SPQ-330', score: '4.6 / 5', visits: 36, oos: 1 },
  { store: 'Supa Quick Boksburg', code: 'SPQ-210', score: '4.3 / 5', visits: 35, oos: 1 },
  { store: 'Supa Quick Vereeniging', code: 'SPQ-441', score: '3.9 / 5', visits: 32, oos: 0 },
];

// Out-of-stock lines captured in store — the two open items drive the OOS KPI.
const OOS_ITEMS = [
  { store: 'Supa Quick Centurion', code: 'SPQ-330', product: 'Bridgestone Turanza T005', size: '205/55 R16', flagged: '2026-08-17', days: 1, rep: 'Willem P.', status: 'Open' },
  { store: 'Supa Quick Boksburg', code: 'SPQ-210', product: 'Firestone Multihawk 2', size: '185/65 R15', flagged: '2026-08-16', days: 2, rep: 'Tumi R.', status: 'Open' },
  { store: 'Supa Quick Vereeniging', code: 'SPQ-441', product: 'Bridgestone Dueler H/T', size: '265/65 R17', flagged: '2026-08-07', days: 4, rep: 'Willem P.', status: 'Resolved' },
  { store: 'Supa Quick Randburg', code: 'SPQ-011', product: 'Bridgestone Ecopia EP150', size: '195/65 R15', flagged: '2026-08-03', days: 3, rep: 'Kagiso T.', status: 'Resolved' },
  { store: 'Supa Quick Boksburg', code: 'SPQ-210', product: 'Bridgestone Potenza RE004', size: '225/45 R17', flagged: '2026-07-29', days: 5, rep: 'Tumi R.', status: 'Resolved' },
];

const TRAINING = [
  { id: 'm1', title: 'Tyre fitment standards', type: 'PDF', meta: '12 pages' },
  { id: 'm2', title: 'Merchandising the forecourt', type: 'Video', meta: '6 min' },
  { id: 'm3', title: 'Handling a customer snag', type: 'PDF', meta: '4 pages' },
];

const state = {
  screen: 'login', code: '', error: '',
  dashTab: 'overview',
  storeCode: CLIENT.stores[0].code, visitType: '',
  visit: null, answers: {}, training: { m1: false, m2: false, m3: false },
};

const root = document.getElementById('root');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function set(patch) { Object.assign(state, patch); render(); }

const logo = (src, alt, h) =>
  `<img src="${src}" alt="${esc(alt)}" height="${h}" style="object-fit:contain" onerror="this.style.display='none'">`;

function loginScreen() {
  return `<form class="card" style="max-width:360px" data-act="signin">
    ${logo('/logos/leegra-logo.png', 'Leegra', 28)}
    <div class="brand">Leegra Pulse</div>
    <div class="slogan">Heartbeat of execution</div>
    <label class="field">Access code
      <input class="input" id="code" inputmode="numeric" autocomplete="off" placeholder="Enter your demo code" value="${esc(state.code)}" autofocus>
    </label>
    <div class="err">${esc(state.error)}</div>
    <button class="btn btn-primary block" type="submit">Sign in</button>
    <div class="muted" style="font-size:11px;text-align:center">Demo access for Supa Quick. This sign-in shows Supa Quick data only.</div>
  </form>`;
}

function chooseScreen() {
  return `<div class="card" style="max-width:420px">
    <div class="nav">
      ${logo('/logos/leegra-logo.png', 'Leegra', 20)}
      <div class="nav-brand">Leegra Pulse</div>
      <button class="tag tag-outline" style="margin-left:auto" data-act="logout">Log out</button>
    </div>
    ${logo(CLIENT.logo, CLIENT.name, 30)}
    <div class="title">Supa Quick</div>
    <div class="muted" style="font-size:13px">Two things to look at: what the field team uses in store, and what you see back at head office.</div>
    <button class="btn btn-secondary block" data-act="go" data-to="app">Field Rep App</button>
    <button class="btn btn-secondary block" data-act="go" data-to="dashboard">Dashboard View</button>
  </div>`;
}

function appScreen() {
  const store = CLIENT.stores.find(s => s.code === state.storeCode) || CLIENT.stores[0];
  const v = state.visit;
  const answered = a => a !== undefined && a !== null && a !== '';
  const done = QUESTIONS.filter(q => answered(state.answers[q.id])).length;

  const questionRows = QUESTIONS.map(q => {
    const a = state.answers[q.id];
    const req = q.required ? ' *' : '';
    if (q.type === 'boolean') {
      return `<div class="row" data-act="toggle" data-q="${q.id}" style="cursor:pointer">
        <span class="dot" style="background:${a ? 'var(--accent-2-400)' : 'var(--neutral-500)'}"></span>
        <div style="flex:1;font-size:13px">${esc(q.label + req)}</div>
        <div class="tag ${a ? 'tag-accent2' : 'tag-neutral'}">${a ? 'Done' : 'Pending'}</div>
      </div>`;
    }
    if (q.type === 'photo') {
      return `<div class="row">
        <div style="flex:1;font-size:13px">${esc(q.label + req)}</div>
        ${a ? `<img src="${a}" alt="" style="width:36px;height:36px;border-radius:6px;object-fit:cover;margin-right:8px">` : ''}
        <label class="tag tag-outline">${a ? 'Retake' : 'Take photo'}
          <input type="file" accept="image/*" capture="environment" style="display:none" data-act="photo" data-q="${q.id}">
        </label>
      </div>`;
    }
    if (q.type === 'choice') {
      return `<div class="row">
        <div style="flex:1;font-size:13px">${esc(q.label + req)}</div>
        <select class="input" style="width:140px" data-act="answer" data-q="${q.id}">
          <option value="" ${a ? '' : 'selected'} disabled>Choose…</option>
          ${q.options.map(o => `<option ${a === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select>
      </div>`;
    }
    return `<div class="row">
      <div style="flex:1;font-size:13px">${esc(q.label + req)}</div>
      <input class="input" style="width:140px" type="${q.type === 'number' ? 'number' : 'text'}" value="${a == null ? '' : esc(a)}" data-act="answer" data-q="${q.id}">
    </div>`;
  }).join('');

  return `<div class="card" style="max-width:380px">
    <div class="nav">
      ${logo(CLIENT.logo, CLIENT.name, 22)}
      <div class="nav-brand">${CLIENT.name}</div>
      ${logo('/logos/leegra-logo.png', 'Leegra', 18)}
      <button class="tag tag-outline" style="margin-left:auto" data-act="go" data-to="choose">Back</button>
    </div>
    <div class="muted" style="font-size:13px">${CLIENT.staffName} · Field rep · ${CLIENT.repStoreCount} stores assigned</div>

    ${!v ? `
      <label class="field">Store
        <select class="input" data-act="store">
          ${CLIENT.stores.map(s => `<option value="${s.code}" ${s.code === store.code ? 'selected' : ''}>${esc(s.name)} (${s.code}) · ${esc(s.region)}</option>`).join('')}
        </select>
      </label>
      <label class="field">Visit type
        <select class="input" data-act="visittype">
          <option value="" ${state.visitType ? '' : 'selected'}>Standard visit</option>
          <option value="snag_report" ${state.visitType === 'snag_report' ? 'selected' : ''}>Snag Report</option>
        </select>
      </label>
      <button class="btn btn-primary block" data-act="checkin">Check in — verify GPS</button>
    ` : `
      <div class="inner">
        <div class="kicker">Checked in</div>
        <div class="title">${esc(store.name)}</div>
        <div class="meta">${store.code} · ${esc(store.region)}</div>
        <span class="tag tag-accent2">Checked in ${v.at}</span>
      </div>
      <button class="btn btn-secondary block" disabled>✓ Checked in — GPS verified</button>
      <div class="label">${state.visitType === 'snag_report' ? 'Snag Report' : 'Visit tasks'} · ${done}/${QUESTIONS.length}</div>
      <div class="stack">${questionRows}</div>
      <button class="btn btn-primary block" data-act="checkout">Check out</button>
    `}

    <div>
      <div class="label">Leegra Learning</div>
      <div class="stack">
        ${TRAINING.map(m => `<div class="row" style="cursor:pointer" data-act="training" data-m="${m.id}">
          <span class="dot" style="background:${state.training[m.id] ? 'var(--accent-2-400)' : 'var(--neutral-500)'}"></span>
          <div style="flex:1;font-size:13px">${esc(m.title)}</div>
          <div class="tag ${state.training[m.id] ? 'tag-accent2' : 'tag-neutral'}">${state.training[m.id] ? 'Completed' : 'Not started'}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

function dashboardScreen() {
  const t = state.dashTab;
  const storeTable = `<div>
    <div class="label">Store coverage</div>
    <table>
      <thead><tr><th>Store</th><th>Region</th><th>Last visit</th><th>Status</th></tr></thead>
      <tbody>${CLIENT.stores.map(s => {
        const c = s.status === 'Due' ? '#e2a336' : s.status === 'Overdue' ? '#e2544a' : '';
        return `<tr><td>${esc(s.name)}</td><td>${esc(s.region)}</td><td>${esc(s.lastVisit)}</td>
          <td><span class="tag tag-outline" style="${c ? `color:${c};border-color:${c}` : ''}">${esc(s.status)}</span></td></tr>`;
      }).join('')}</tbody>
    </table>
  </div>`;
  const board = `<div>
    <div class="label">Staff leaderboard — visit compliance</div>
    <div class="stack">${CLIENT.leaderboard.map(r => `<div class="row">
      <div style="flex:1;font-size:13px">${r.rank} · ${esc(r.name)}</div>
      <div class="tag tag-accent">${r.score} compliance</div>
    </div>`).join('')}</div>
  </div>`;

  const dataTable = `<div class="stack" style="gap:20px"><div>
    <div class="label">Visit records — August 2026 · ${VISIT_DATA.length} of 141 shown</div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Date</th><th>Store</th><th>Region</th><th>Rep</th><th>Visit type</th><th>Score</th><th>OOS</th><th>Status</th></tr></thead>
        <tbody>${VISIT_DATA.map(r => `<tr>
          <td>${esc(r.date)}</td><td>${esc(r.store)}<div class="meta">${r.code}</div></td>
          <td>${esc(r.region)}</td><td>${esc(r.rep)}</td><td>${esc(r.type)}</td><td>${esc(r.score)}</td>
          <td>${r.oos ? `<span class="tag tag-outline" style="color:#e2a336;border-color:#e2a336">${r.oos}</span>` : '—'}</td>
          <td><span class="tag tag-accent2">${esc(r.status)}</span></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>
    <div>
      <div class="label">Out of stock — 2 open · 3 resolved this month</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Store</th><th>Product</th><th>Size</th><th>Flagged</th><th>Days open</th><th>Reported by</th><th>Status</th></tr></thead>
          <tbody>${OOS_ITEMS.map(o => `<tr>
            <td>${esc(o.store)}<div class="meta">${o.code}</div></td>
            <td>${esc(o.product)}</td><td>${esc(o.size)}</td><td>${esc(o.flagged)}</td><td>${o.days}</td><td>${esc(o.rep)}</td>
            <td><span class="tag ${o.status === 'Open' ? 'tag-outline' : 'tag-accent2'}" style="${o.status === 'Open' ? 'color:#e2a336;border-color:#e2a336' : ''}">${esc(o.status)}</span></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
</div>`;

  return `<div class="card" style="max-width:860px">
    <div class="nav">
      ${logo('/logos/leegra-logo.png', 'Leegra', 20)}
      <div class="nav-brand">Leegra Pulse</div>
      ${logo(CLIENT.logo, CLIENT.name, 20)}
      <div class="tag tag-accent">Client: ${CLIENT.name}</div>
      <nav>
        <a href="#" class="${t === 'overview' ? 'on' : ''}" data-act="tab" data-tab="overview">Overview</a>
        <a href="#" class="${t === 'stores' ? 'on' : ''}" data-act="tab" data-tab="stores">Stores</a>
        <a href="#" class="${t === 'staff' ? 'on' : ''}" data-act="tab" data-tab="staff">Staff</a>
        <a href="#" class="${t === 'data' ? 'on' : ''}" data-act="tab" data-tab="data">Data</a>
      </nav>
      <button class="tag tag-outline" data-act="go" data-to="report">View full report</button>
      <button class="tag tag-outline" style="margin-left:auto" data-act="go" data-to="choose">Back</button>
    </div>

    <div class="grid4">
      <div class="inner"><div class="kicker">Visit compliance</div><div class="title lg">${CLIENT.compliance}</div></div>
      <div class="inner"><div class="kicker">Completed / planned</div><div class="title lg">${CLIENT.completedPlanned}</div></div>
      <div class="inner"><div class="kicker">Stores covered</div><div class="title lg">${CLIENT.storesCovered}</div></div>
      <div class="inner"><div class="kicker">Open OOS issues</div><div class="title lg accent">${CLIENT.oosIssues}</div></div>
    </div>

    <div class="${t === 'overview' ? 'grid2' : ''}">
      ${t === 'overview' || t === 'stores' ? storeTable : ''}
      ${t === 'overview' || t === 'staff' ? board : ''}
      ${t === 'data' ? dataTable : ''}
    </div>

    ${t === 'data' ? '' : `<div>
      <div class="label">Leegra Learning — training material</div>
      <div class="grid3">${TRAINING.map(m => `<div class="inner">
        <div class="title" style="font-size:14px">${esc(m.title)}</div>
        <div class="meta">${m.type} · ${m.meta}</div>
        <div class="tag tag-accent2">Assigned to all reps</div>
      </div>`).join('')}</div>
    </div>`}

    <div class="muted" style="font-size:11px">Visible to ${CLIENT.name} only — other clients' data is not queryable from this session.</div>
  </div>`;
}

function reportScreen() {
  const avg = (SCORES.reduce((a, s) => a + s.v, 0) / SCORES.length).toFixed(1);
  return `<div class="card" style="max-width:860px">
    <div class="nav">
      ${logo(CLIENT.logo, CLIENT.name, 24)}
      <div class="nav-brand">Supa Quick Reality Check</div>
      <div class="tag tag-accent">August 2026</div>
      <button class="tag tag-outline" style="margin-left:auto" data-act="go" data-to="dashboard">Back to dashboard</button>
    </div>
    <div class="muted" style="font-size:13px">Field evidence from 141 completed store visits across 30 branches.</div>

    <div class="grid4">
      <div class="inner"><div class="kicker">Performance score</div><div class="title lg">${avg} / 5</div><div class="meta">Average of every scored field</div></div>
      <div class="inner"><div class="kicker">Brand recommended</div><div class="title lg">87%</div><div class="meta">Of visits where staff recommended first</div></div>
      <div class="inner"><div class="kicker">Visits completed</div><div class="title lg">141/150</div><div class="meta">94% of plan</div></div>
      <div class="inner"><div class="kicker">Open OOS issues</div><div class="title lg accent">2</div><div class="meta">Both flagged this week</div></div>
    </div>

    <div class="grid2">
      <div>
        <div class="label">Performance score — by field</div>
        <div class="stack">${SCORES.map(s => `<div class="barrow">
          <div>
            <div style="margin-bottom:5px">${esc(s.label)}</div>
            <div class="bar"><i style="width:${(s.v / 5 * 100).toFixed(0)}%"></i></div>
          </div>
          <div class="n">${s.v.toFixed(1)}</div>
        </div>`).join('')}</div>
      </div>
      <div>
        <div class="label">Compliance by region</div>
        <div class="stack">${REGIONS.map(r => `<div class="barrow">
          <div>
            <div style="margin-bottom:5px">${esc(r.label)}</div>
            <div class="bar"><i style="width:${r.v}%"></i></div>
          </div>
          <div class="n">${r.v}%</div>
        </div>`).join('')}</div>
      </div>
    </div>

    <div>
      <div class="label">Store ranking</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>#</th><th>Store</th><th>Score</th><th>Visits</th><th>OOS</th></tr></thead>
          <tbody>${RANKING.map((r, i) => `<tr>
            <td>${i + 1}</td>
            <td>${esc(r.store)}<div class="meta">${r.code}</div></td>
            <td>${esc(r.score)}</td>
            <td>${r.visits}</td>
            <td>${r.oos ? `<span class="tag tag-outline" style="color:#e2a336;border-color:#e2a336">${r.oos}</span>` : '—'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>


    <div>
      <div class="label">Out of stock — 2 open · 3 resolved this month</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Store</th><th>Product</th><th>Size</th><th>Flagged</th><th>Days open</th><th>Reported by</th><th>Status</th></tr></thead>
          <tbody>${OOS_ITEMS.map(o => `<tr>
            <td>${esc(o.store)}<div class="meta">${o.code}</div></td>
            <td>${esc(o.product)}</td><td>${esc(o.size)}</td><td>${esc(o.flagged)}</td><td>${o.days}</td><td>${esc(o.rep)}</td>
            <td><span class="tag ${o.status === 'Open' ? 'tag-outline' : 'tag-accent2'}" style="${o.status === 'Open' ? 'color:#e2a336;border-color:#e2a336' : ''}">${esc(o.status)}</span></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div>
      <div class="label">Granular drill-down</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Date</th><th>Store</th><th>Region</th><th>Rep</th><th>Visit type</th><th>Score</th><th>OOS</th></tr></thead>
          <tbody>${VISIT_DATA.map(r => `<tr>
            <td>${esc(r.date)}</td><td>${esc(r.store)}</td><td>${esc(r.region)}</td>
            <td>${esc(r.rep)}</td><td>${esc(r.type)}</td><td>${esc(r.score)}</td>
            <td>${r.oos || '—'}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="muted" style="font-size:11px">Prepared by Leegra Pulse. Figures shown are demonstration data.</div>
  </div>`;
}

function render() {
  const screens = { login: loginScreen, choose: chooseScreen, app: appScreen, dashboard: dashboardScreen, report: reportScreen };
  root.innerHTML = (screens[state.screen] || loginScreen)();
  const focus = root.querySelector('[autofocus]');
  if (focus) focus.focus();
}

root.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.act !== 'signin') return;
  const val = root.querySelector('#code').value.trim();
  if (val === DEMO_CODE) set({ screen: 'choose', error: '', code: '' });
  else set({ code: val, error: 'That code is not valid.' });
});

root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab' || act === 'go') e.preventDefault();
  if (act === 'go') set({ screen: el.dataset.to });
  else if (act === 'tab') set({ dashTab: el.dataset.tab });
  else if (act === 'logout') set({ screen: 'login', visit: null, answers: {}, code: '', error: '' });
  else if (act === 'checkin') set({ visit: { at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }, answers: {} });
  else if (act === 'checkout') set({ visit: null, answers: {}, visitType: '' });
  else if (act === 'toggle') { state.answers[el.dataset.q] = !state.answers[el.dataset.q]; render(); }
  else if (act === 'training') { state.training[el.dataset.m] = !state.training[el.dataset.m]; render(); }
});

root.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'store') set({ storeCode: el.value });
  else if (act === 'visittype') set({ visitType: el.value });
  else if (act === 'answer') { state.answers[el.dataset.q] = el.value; }
  else if (act === 'photo' && el.files && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => { state.answers[el.dataset.q] = reader.result; render(); };
    reader.readAsDataURL(el.files[0]);
  }
});

render();
</script>
</body>
</html>
