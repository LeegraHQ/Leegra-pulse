document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"86b24d33-02a9-4253-b54c-fc4bce2e3ef2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"d8013ba7-9d83-49f0-ba80-e63c603987e6\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;font-family:'Manrope',Arial,Helvetica,sans-serif;background:#E9EDF2;color:#111827}\n::placeholder{color:#94A3B8}\na{color:#0A2342}\na:hover{color:#F28C28}\nbutton,input,select,textarea{font-family:inherit;font-size:16px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:460px;margin:0 auto;min-height:100vh;background:#F4F6F8;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(15,23,42,.08)\">\n\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;background:#0A2342;display:flex;flex-direction:column;justify-content:center;padding:32px 22px;min-height:100vh\">\n      <div style=\"display:flex;gap:12px;align-items:center;margin-bottom:28px\">\n        <img src=\"382b4570-a7a5-4dd6-a35d-406440a81890\" alt=\"Hatfield\" style=\"width:52px;height:52px;border-radius:50%;background:#fff;object-fit:contain\">\n        <div>\n          <h1 style=\"margin:0;font-size:22px;color:#fff;font-weight:800\">Hatfield Audit<\u002Fh1>\n          <p style=\"margin:2px 0 0;color:#B8C4D9;font-size:12px;letter-spacing:.06em;text-transform:uppercase\">Leegra Pulse · Shopper capture<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:22px;padding:24px\">\n        <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Email<\u002Flabel>\n        <input value=\"{{ loginEmail }}\" sc-camel-on-change=\"{{ setLoginEmail }}\" placeholder=\"Shopper@hatfieldgroup.co.za\" autocomplete=\"username\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:13px 14px;width:100%;margin-bottom:14px\">\n        <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Log in code<\u002Flabel>\n        <input value=\"{{ loginCode }}\" sc-camel-on-change=\"{{ setLoginCode }}\" placeholder=\"4-digit code\" inputmode=\"numeric\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:13px 14px;width:100%;margin-bottom:16px\">\n        <button sc-camel-on-click=\"{{ doLogin }}\" style=\"border:0;background:#F28C28;color:#fff;padding:15px;border-radius:14px;font-weight:800;cursor:pointer;width:100%\">Sign In<\u002Fbutton>\n        <sc-if value=\"{{ hasLoginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"color:#DC2626;font-size:13px;margin:12px 0 0\">{{ loginError }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <header style=\"background:#0A2342;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n        <div style=\"display:flex;gap:10px;align-items:center;min-width:0\">\n          <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ goBack }}\" style=\"border:0;background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:12px;font-weight:800;font-size:20px;cursor:pointer;flex-shrink:0\">‹<\u002Fbutton>\n          <\u002Fsc-if>\n          <div style=\"min-width:0\">\n            <p style=\"margin:0;font-size:11px;color:#F28C28;font-weight:800;text-transform:uppercase;letter-spacing:.1em\">{{ headKicker }}<\u002Fp>\n            <h2 style=\"margin:2px 0 0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ headTitle }}<\u002Fh2>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ logout }}\" style=\"border:0;background:none;color:#B8C4D9;font-size:12px;font-weight:700;cursor:pointer;padding:8px 0;flex-shrink:0\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:12px;height:6px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden\"><div style=\"height:100%;background:#F28C28;border-radius:999px;width:{{ progressPct }}\"><\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:6px 0 0;font-size:11px;color:#B8C4D9\">{{ progressText }}<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fheader>\n\n    <main style=\"flex:1;padding:16px;display:flex;flex-direction:column;gap:14px\">\n\n      <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ startNew }}\" style=\"border:0;background:#F28C28;color:#fff;padding:18px;border-radius:18px;font-weight:800;font-size:17px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center\">Start new audit<span style=\"font-size:22px\">+<\u002Fspan><\u002Fbutton>\n        <sc-if value=\"{{ hasDraft }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ resumeDraft }}\" style=\"border:1px solid #F28C28;background:#fff7ed;color:#7c2d12;padding:16px;border-radius:18px;font-weight:800;cursor:pointer;text-align:left\">\n            <span style=\"display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#F28C28\">Draft in progress<\u002Fspan>\n            <span style=\"display:block;margin-top:4px;font-size:15px\">{{ draftLabel }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <p style=\"margin:8px 0 0;font-size:12px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:.08em\">Submitted from this device<\u002Fp>\n        <sc-for list=\"{{ submitted }}\" as=\"s\" hint-placeholder-count=\"2\">\n          <div style=\"background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n            <div style=\"min-width:0\"><strong style=\"display:block;font-size:15px;color:#0A2342\">{{ s.dealer }}<\u002Fstrong><span style=\"font-size:12px;color:#64748b\">{{ s.detail }}<\u002Fspan><\u002Fdiv>\n            <span style=\"padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;background:{{ s.bg }};color:{{ s.color }}\">{{ s.pctText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ noSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;font-size:14px;color:#94a3b8\">No audits submitted yet.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:18px;padding:18px;border:1px solid #e5e7eb;display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Dealership<\u002Flabel>\n            <sc-raw-select value=\"{{ d.dealer }}\" sc-camel-on-change=\"{{ setDealer }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:13px 12px;width:100%;background:#fff;font-weight:700;color:#0A2342\">\n              <option value=\"\">Select dealership<\u002Foption>\n              <sc-for list=\"{{ dealerOptions }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Department<\u002Flabel>\n            <div style=\"display:grid;gap:8px\">\n              <sc-for list=\"{{ deptButtons }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ b.go }}\" style=\"border:1px solid {{ b.border }};background:{{ b.bg }};color:{{ b.color }};padding:14px;border-radius:14px;font-weight:800;cursor:pointer;text-align:left\">{{ b.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <div>\n              <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Audit number<\u002Flabel>\n              <input type=\"number\" min=\"1\" value=\"{{ d.auditNo }}\" sc-camel-on-change=\"{{ setAuditNo }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:12px;width:100%\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Audit date<\u002Flabel>\n              <input type=\"date\" value=\"{{ d.auditDate }}\" sc-camel-on-change=\"{{ setAuditDate }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:11px;width:100%\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Staff member assisting<\u002Flabel>\n            <input value=\"{{ d.staff }}\" sc-camel-on-change=\"{{ setStaff }}\" placeholder=\"Name of sales executive / advisor\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:12px;width:100%\">\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasReplaceNote }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:13px;color:#92400e;background:#fef3c7;padding:10px 12px;border-radius:12px\">{{ replaceNote }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ beginQuestions }}\" style=\"border:0;background:{{ beginBg }};color:#fff;padding:16px;border-radius:16px;font-weight:800;cursor:pointer\">Start questions<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isQuestions }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0;font-size:12px;color:#F28C28;font-weight:800;text-transform:uppercase;letter-spacing:.1em\">{{ sectionLabel }}<\u002Fp>\n        <sc-for list=\"{{ qCards }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"background:#fff;border-radius:18px;padding:16px;border:1px solid #e5e7eb;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;justify-content:space-between;gap:10px\">\n              <strong style=\"font-size:15px;color:#0A2342;line-height:1.4;text-wrap:pretty\">{{ q.question }}<\u002Fstrong>\n              <span style=\"font-size:11px;color:#94a3b8;font-weight:700;white-space:nowrap\">{{ q.weightText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:6px\">\n              <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.color }};height:46px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;padding:0\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <textarea value=\"{{ q.evidence }}\" sc-camel-on-change=\"{{ q.setEvidence }}\" placeholder=\"Evidence / comments\" rows=\"2\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:11px 12px;width:100%;resize:vertical\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n          <button sc-camel-on-click=\"{{ prevSection }}\" style=\"border:1px solid #d1d5db;background:#fff;color:#0A2342;padding:15px;border-radius:16px;font-weight:800;cursor:pointer\">{{ prevLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ nextSection }}\" style=\"border:0;background:#0A2342;color:#fff;padding:15px;border-radius:16px;font-weight:800;cursor:pointer\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isWrap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:18px;padding:18px;border:1px solid #e5e7eb;display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Corrective action<\u002Flabel>\n            <textarea value=\"{{ d.action }}\" sc-camel-on-change=\"{{ setAction }}\" rows=\"3\" placeholder=\"e.g. Re audit to be done with another customer, same sales person\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:12px;width:100%;resize:vertical\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Owner<\u002Flabel>\n            <input value=\"{{ d.owner }}\" sc-camel-on-change=\"{{ setOwner }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:12px;width:100%\">\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <div>\n              <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Due date<\u002Flabel>\n              <input type=\"date\" value=\"{{ d.due }}\" sc-camel-on-change=\"{{ setDue }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:11px;width:100%\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-size:13px;color:#64748b;margin:0 0 6px;font-weight:700\">Status<\u002Flabel>\n              <sc-raw-select value=\"{{ d.status }}\" sc-camel-on-change=\"{{ setStatus }}\" style=\"border:1px solid #d1d5db;border-radius:12px;padding:12px;width:100%;background:#fff\">\n                <option value=\"Open\">Open<\u002Foption><option value=\"In Progress\">In Progress<\u002Foption><option value=\"Closed\">Closed<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <p style=\"margin:0;font-size:13px;color:#64748b;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px 14px\">Proof of audit (booking reference, communication, photos, video feedback) is uploaded by Leegra on the dashboard.<\u002Fp>\n        <div style=\"background:#0A2342;color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <div><p style=\"margin:0;font-size:11px;color:#B8C4D9;text-transform:uppercase;letter-spacing:.08em\">Leegra Performance Index<\u002Fp><p style=\"margin:4px 0 0;font-size:13px;color:#B8C4D9\">{{ answeredText }}<\u002Fp><\u002Fdiv>\n          <strong style=\"font-size:30px;color:{{ lpiColor }}\">{{ lpiText }}<\u002Fstrong>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSubmitError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:13px;color:#DC2626\">{{ submitError }}<\u002Fp>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ submit }}\" style=\"border:0;background:#F28C28;color:#fff;padding:17px;border-radius:16px;font-weight:800;font-size:17px;cursor:pointer\">Submit audit<\u002Fbutton>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:22px;padding:28px 20px;border:1px solid #e5e7eb;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center\">\n          <div style=\"width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#16A34A;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800\">✓<\u002Fdiv>\n          <h3 style=\"margin:0;font-size:20px;color:#0A2342;font-weight:800\">Audit submitted<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;color:#64748b\">{{ doneText }}<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goHome }}\" style=\"border:0;background:#0A2342;color:#fff;padding:16px;border-radius:16px;font-weight:800;cursor:pointer\">Back to home<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst DEPTS = [{ key: 'new', name: 'New Car Sales', mgr: 'newCar' }, { key: 'used', name: 'Used Car Sales', mgr: 'usedCar' }, { key: 'service', name: 'Service Department', mgr: 'service' }];\nconst LS_DRAFT = 'hatfield-capture-draft-v1';\nconst SCORES = [0, 0.25, 0.5, 0.75, 1];\nconst PROOF = [\n  { cat: 'booking', label: 'Booking Reference', accept: 'image/*,application/pdf' },\n  { cat: 'comms', label: 'Communication', accept: 'image/*,application/pdf' },\n  { cat: 'general', label: 'Dealership General', accept: 'image/*' },\n  { cat: 'video', label: 'Video Feedback', link: true },\n];\nconst catOf = x => x.cat === 'photo' ? 'general' : x.cat === 'corr' ? 'comms' : x.cat;\nconst band = p => p == null ? '#94a3b8' : p >= 80 ? '#16A34A' : p >= 60 ? '#F59E0B' : '#DC2626';\nconst bandBg = p => p == null ? ['#e2e8f0', '#475569'] : p >= 80 ? ['#dcfce7', '#166534'] : p >= 60 ? ['#fef3c7', '#92400e'] : ['#fee2e2', '#991b1b'];\nconst pct = rows => { let w = 0, s = 0; rows.forEach(r => { if (r.score != null) { w += r.weight; s += r.weight * r.score; } }); return w ? s / w * 100 : null; };\nconst today = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };\nconst keyOf = d => d.dealer + '|' + d.dept + '|' + d.auditNo;\nconst store = () => window.HatfieldStore;\n\nclass Component extends DCLogic {\n  state = { user: null, pack: null, screen: 'home', loginEmail: '', loginCode: '', loginError: '', draft: null, section: 0, submitError: '', lastDone: '', busy: false, linkValue: '' };\n\n  componentDidMount() {\n    let draft = null;\n    try { draft = JSON.parse(localStorage.getItem(LS_DRAFT) || 'null'); } catch (e) {}\n    this.setState({ draft });\n    const wait = () => store() ? this.boot() : setTimeout(wait, 50);\n    wait();\n  }\n  async boot() {\n    const s = store().session();\n    if (s && s.user && ['shopper', 'super'].includes(s.user.role)) { this.setState({ user: s.user }); this.reload(); }\n  }\n  async reload() {\n    try { const pack = await store().load(); this.setState({ pack }); } catch (e) { this.setState({ user: null }); }\n  }\n  saveDraft(draft) { try { localStorage.setItem(LS_DRAFT, JSON.stringify(draft)); } catch (e) {} this.setState({ draft }); }\n  patch(p) { this.saveDraft({ ...(this.state.draft || {}), ...p }); }\n  nextAuditNo(dealer, dept) {\n    const all = (this.state.pack ? this.state.pack.data.audits : []).filter(a => a.dealer === dealer && a.dept === dept);\n    const sched = all.filter(a => a.state === 'scheduled').sort((a, b) => a.auditNo - b.auditNo)[0];\n    return sched ? sched.auditNo : all.reduce((m, a) => Math.max(m, a.auditNo), 0) + 1;\n  }\n  ownerFor(dealer, dept) {\n    const d = this.state.pack && this.state.pack.data.dealers.find(x => x.name === dealer);\n    const dp = DEPTS.find(x => x.key === dept);\n    return d && dp && d[dp.mgr] ? d[dp.mgr].name || '' : '';\n  }\n  pickDept(dept) {\n    const d = this.state.draft || {};\n    const bank = this.state.pack.data.questionBank[dept];\n    const rows = bank.map(q => ({ ...q, score: null, evidence: '' }));\n    this.patch({ dept, rows, auditNo: d.dealer ? this.nextAuditNo(d.dealer, dept) : d.auditNo, owner: d.dealer ? this.ownerFor(d.dealer, dept) : '' });\n  }\n\n  renderVals() {\n    const { user, pack, screen, draft, section } = this.state;\n    const d = draft || {};\n    const out = {\n      isLogin: !user, isApp: !!user, d,\n      loginEmail: this.state.loginEmail, loginCode: this.state.loginCode,\n      setLoginEmail: e => this.setState({ loginEmail: e.target.value }),\n      setLoginCode: e => this.setState({ loginCode: e.target.value }),\n      hasLoginError: !!this.state.loginError, loginError: this.state.loginError,\n      doLogin: async () => {\n        try {\n          const u = await store().login(this.state.loginEmail, this.state.loginCode);\n          if (!['shopper', 'super'].includes(u.role)) { store().logout(); return this.setState({ loginError: 'This log in is for the dashboard. Use the shopper log in here.' }); }\n          this.setState({ user: u, loginError: '', loginCode: '', screen: 'home' }); this.reload();\n        } catch (e) { this.setState({ loginError: e.message }); }\n      },\n      logout: () => { store().logout(); this.setState({ user: null, pack: null }); },\n      isHome: screen === 'home', isSetup: screen === 'setup', isQuestions: screen === 'questions', isWrap: screen === 'wrap', isDone: screen === 'done',\n      showBack: ['setup', 'questions', 'wrap'].includes(screen),\n    };\n    const dept = DEPTS.find(x => x.key === d.dept);\n    const titles = { home: ['Mystery shopping', 'Audits'], setup: ['New audit', 'Audit details'], questions: [dept ? dept.name : '', d.dealer || ''], wrap: [dept ? dept.name : '', 'Corrective action'], done: ['Complete', 'Thank you'] };\n    out.headKicker = titles[screen][0]; out.headTitle = titles[screen][1];\n    const rows = d.rows || [];\n    const sections = [...new Set(rows.map(r => r.section))];\n    out.goBack = () => this.setState(s => s.screen === 'setup' ? { screen: 'home' } : s.screen === 'questions' ? (s.section > 0 ? { section: s.section - 1 } : { screen: 'setup' }) : { screen: 'questions', section: Math.max(0, sections.length - 1) });\n    const answered = rows.filter(r => r.score != null).length;\n    out.showProgress = screen === 'questions' || screen === 'wrap';\n    out.progressPct = rows.length ? Math.round(answered / rows.length * 100) + '%' : '0%';\n    out.progressText = answered + ' of ' + rows.length + ' questions scored';\n    if (!pack) return { ...out, submitted: [], noSubmitted: true, dealerOptions: [], deptButtons: [] };\n\n    out.startNew = () => { this.saveDraft({ dealer: '', dept: '', auditNo: 1, auditDate: today(), staff: '', rows: [], action: '', owner: '', due: '', status: 'Open' }); this.setState({ screen: 'setup', section: 0, submitError: '' }); };\n    out.hasDraft = !!(draft && draft.dealer && draft.dept);\n    out.draftLabel = out.hasDraft ? d.dealer + ' · ' + (dept ? dept.name : '') + ' · Audit ' + d.auditNo : '';\n    out.resumeDraft = () => this.setState({ screen: 'setup', section: 0 });\n    const mine = pack.data.audits.filter(a => a.source === 'capture-app').sort((a, b) => (b.capturedAt || '').localeCompare(a.capturedAt || ''));\n    out.submitted = mine.map(a => { const p = pct(a.rows); const [bg, color] = bandBg(p); return { dealer: a.dealer, detail: (DEPTS.find(x => x.key === a.dept) || {}).name + ' · Audit ' + a.auditNo + (a.auditDate ? ' · ' + a.auditDate : ''), pctText: p == null ? '—' : Math.round(p) + '%', bg, color }; });\n    out.noSubmitted = !mine.length;\n\n    out.dealerOptions = pack.data.dealers.map(x => x.name);\n    out.setDealer = e => { const dealer = e.target.value; this.patch({ dealer, auditNo: d.dept ? this.nextAuditNo(dealer, d.dept) : d.auditNo, owner: d.dept ? this.ownerFor(dealer, d.dept) : d.owner }); };\n    out.deptButtons = DEPTS.map(x => { const on = d.dept === x.key; return { name: x.name, border: on ? '#0A2342' : '#d1d5db', bg: on ? '#0A2342' : '#fff', color: on ? '#fff' : '#0A2342', go: () => this.pickDept(x.key) }; });\n    out.setAuditNo = e => this.patch({ auditNo: Math.max(1, parseInt(e.target.value, 10) || 1) });\n    out.setAuditDate = e => this.patch({ auditDate: e.target.value });\n    out.setStaff = e => this.patch({ staff: e.target.value });\n    const existing = d.dealer && d.dept && pack.data.audits.find(a => a.dealer === d.dealer && a.dept === d.dept && a.auditNo === d.auditNo);\n    out.hasReplaceNote = !!(existing && existing.state === 'complete');\n    out.replaceNote = 'Audit ' + d.auditNo + ' already has scores for this dealer. Submitting will replace it.';\n    const ready = d.dealer && d.dept && d.auditDate;\n    out.beginBg = ready ? '#0A2342' : '#94a3b8';\n    out.beginQuestions = () => { if (ready) this.setState({ screen: 'questions', section: 0 }); };\n\n    if (screen === 'questions') {\n      const sec = sections[section];\n      out.sectionLabel = 'Section ' + (section + 1) + ' of ' + sections.length + ' · ' + sec;\n      out.qCards = rows.map((r, i) => ({ r, i })).filter(x => x.r.section === sec).map(({ r, i }) => ({\n        question: r.question, weightText: Math.round(r.weight * 1000) / 10 + '%', evidence: r.evidence,\n        setEvidence: e => { const nr = rows.slice(); nr[i] = { ...nr[i], evidence: e.target.value }; this.patch({ rows: nr }); },\n        opts: SCORES.map(s => { const on = r.score === s; return { label: Math.round(s * 100) + '%', border: on ? band(s * 100) : '#d1d5db', bg: on ? band(s * 100) : '#fff', color: on ? '#fff' : '#0A2342', pick: () => { const nr = rows.slice(); nr[i] = { ...nr[i], score: s }; this.patch({ rows: nr }); } }; }),\n      }));\n      out.prevLabel = section > 0 ? 'Previous' : 'Details';\n      out.nextLabel = section < sections.length - 1 ? 'Next section' : 'Corrective action';\n      out.prevSection = () => this.setState(s => s.section > 0 ? { section: s.section - 1 } : { screen: 'setup' });\n      out.nextSection = () => { window.scrollTo(0, 0); this.setState(s => s.section < sections.length - 1 ? { section: s.section + 1 } : { screen: 'wrap' }); };\n    }\n\n    if (screen === 'wrap') {\n      out.setAction = e => this.patch({ action: e.target.value });\n      out.setOwner = e => this.patch({ owner: e.target.value });\n      out.setDue = e => this.patch({ due: e.target.value });\n      out.setStatus = e => this.patch({ status: e.target.value });\n      const key = keyOf(d);\n      const files = (pack.proof && pack.proof[key]) || [];\n      out.proofCats = PROOF.map(c => {\n        const items = files.filter(x => catOf(x) === c.cat);\n        return {\n          label: c.label, accept: c.accept, count: items.length, isFile: !c.link, isLinkCat: !!c.link, linkValue: this.state.linkValue,\n          setLink: e => this.setState({ linkValue: e.target.value }),\n          addLink: async () => { try { await store().addProofLink(key, this.state.linkValue.trim(), ''); this.setState({ linkValue: '', submitError: '' }); this.reload(); } catch (err) { this.setState({ submitError: err.message }); } },\n          onUpload: async e => {\n            const list = Array.from(e.target.files || []); e.target.value = '';\n            this.setState({ submitError: '' });\n            for (const file of list) { try { await store().uploadProof(key, c.cat, file); } catch (err) { this.setState({ submitError: err.message }); } }\n            this.reload();\n          },\n          items: items.map(it => ({ name: it.name, url: it.url, isLink: it.mime === 'text/uri-list', isImage: it.mime !== 'text/uri-list' && /^image\\//.test(it.mime || ''), isOther: it.mime !== 'text/uri-list' && !/^image\\//.test(it.mime || ''), remove: async () => { try { await store().deleteProof(it.id); } catch (err) { this.setState({ submitError: err.message }); } this.reload(); } })),\n        };\n      });\n      const p = pct(rows);\n      out.lpiText = p == null ? '—' : Math.round(p) + '%';\n      out.lpiColor = p == null ? '#fff' : band(p);\n      out.answeredText = answered + ' of ' + rows.length + ' scored';\n      out.hasSubmitError = !!this.state.submitError; out.submitError = this.state.submitError;\n      out.submit = async () => {\n        if (this.state.busy) return;\n        if (answered < rows.length) return this.setState({ submitError: 'Score every question before submitting (' + (rows.length - answered) + ' left).' });\n        this.setState({ busy: true, submitError: '' });\n        try {\n          await store().saveAudit({ ...d, state: 'complete', source: 'capture-app', capturedAt: new Date().toISOString() });\n          const label = d.dealer + ' · ' + dept.name + ' · Audit ' + d.auditNo + ' · ' + Math.round(p) + '%';\n          try { localStorage.removeItem(LS_DRAFT); } catch (e) {}\n          this.setState({ draft: null, screen: 'done', lastDone: label, busy: false });\n          this.reload();\n        } catch (err) { this.setState({ submitError: err.message, busy: false }); }\n      };\n    }\n    out.doneText = this.state.lastDone + '. It is now on the Hatfield dashboard.';\n    out.goHome = () => this.setState({ screen: 'home' });\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
