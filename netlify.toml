[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

# Emails each code holder the new month's access code at 06:00 UTC on the 1st.
[functions."monthly-code-email"]
  schedule = "0 6 1 * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
